# -----------------------------------------------------------------------------
# Terraform checks on every pull request to main.
#
# Runs format, validate and tflint for each Terraform stack, then a security
# scan of all Terraform code. Any failure blocks the merge (branch protection
# requires these jobs). No cloud credentials are used: validate runs with
# -backend=false, so this workflow cannot read or change AWS.
#
# Actions are pinned to full commit SHAs, not tags: a tag can be moved to
# different code, a SHA cannot. The comment after each SHA is the release it
# came from; update both together.
# -----------------------------------------------------------------------------
    name: terraform-checks

    on:
      pull_request:
        branches: [main]

    permissions:
      contents: read

    concurrency:
      group: terraform-checks-${{ github.ref }}
      cancel-in-progress: true

    env:
      TF_VERSION: 1.16.0
      TFLINT_VERSION: v0.65.0

    jobs:
      lint:
        name: lint (${{ matrix.stack }})
        runs-on: ubuntu-24.04
        strategy:
          fail-fast: false
          matrix:
            stack: [bootstrap, envs/dev]
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false

          - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
            with:
              terraform_version: ${{ env.TF_VERSION }}
              terraform_wrapper: false

          - name: terraform fmt
            run: terraform -chdir=${{ matrix.stack }} fmt -check -diff

          - name: terraform validate
            run: |
              terraform -chdir=${{ matrix.stack }} init -backend=false -input=false
              terraform -chdir=${{ matrix.stack }} validate

          - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
            with:
              tflint_version: ${{ env.TFLINT_VERSION }}

          - name: tflint
            env:
              GITHUB_TOKEN: ${{ github.token }}
            run: |
              tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
              tflint --chdir=${{ matrix.stack }} --config "$GITHUB_WORKSPACE/.tflint.hcl"

      security-scan:
        name: security-scan
        runs-on: ubuntu-24.04
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false

          - name: trivy config scan
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              scan-type: config
              scan-ref: .
              severity: HIGH,CRITICAL
              exit-code: "1"
